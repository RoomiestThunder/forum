version: "3.9"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://forum:forum@postgres:5432/forum?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET: "forum"
      # The app reaches MinIO as minio:9000, which a browser can't resolve, so
      # tell it where the browser can fetch uploaded files from.
      MINIO_PUBLIC_URL: "http://localhost:9000/forum"
      JWT_SECRET: "change-me-in-production"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_FROM: "forum@localhost"
      BASE_URL: "http://localhost:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    networks:
      - forum-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: forum
      POSTGRES_DB: forum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial.up.sql:/docker-entrypoint-initdb.d/001_initial.sql
      - ./migrations/002_user_profiles.up.sql:/docker-entrypoint-initdb.d/002_user_profiles.sql
      - ./migrations/003_tags_bookmarks.up.sql:/docker-entrypoint-initdb.d/003_tags_bookmarks.sql
      - ./migrations/004_notifications.up.sql:/docker-entrypoint-initdb.d/004_notifications.sql
      - ./migrations/005_roles_and_reports.up.sql:/docker-entrypoint-initdb.d/005_roles_and_reports.sql
      - ./migrations/006_account_security.up.sql:/docker-entrypoint-initdb.d/006_account_security.sql
      - ./migrations/007_drop_sessions.up.sql:/docker-entrypoint-initdb.d/007_drop_sessions.sql
      - ./migrations/008_direct_messages.up.sql:/docker-entrypoint-initdb.d/008_direct_messages.sql
      - ./migrations/009_post_drafts.up.sql:/docker-entrypoint-initdb.d/009_post_drafts.sql
      - ./migrations/010_user_blocks.up.sql:/docker-entrypoint-initdb.d/010_user_blocks.sql
      - ./migrations/011_threaded_comments.up.sql:/docker-entrypoint-initdb.d/011_threaded_comments.sql
      - ./migrations/012_audit_log.up.sql:/docker-entrypoint-initdb.d/012_audit_log.sql
      - ./migrations/013_unique_usernames.up.sql:/docker-entrypoint-initdb.d/013_unique_usernames.sql
      - ./migrations/014_email_lookup_index.up.sql:/docker-entrypoint-initdb.d/014_email_lookup_index.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - forum-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - forum-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - forum-net

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP
    networks:
      - forum-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - forum-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - forum-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:

networks:
  forum-net:
    driver: bridge
